name: Native C++ build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debian:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ qt6-base-dev qt6-wayland ffmpeg rpm dpkg-dev weston xvfb fonts-noto-cjk
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr && cmake --build build -j2
      - run: ctest --test-dir build --output-on-failure
      - run: bash tests/display-smoke.sh build/ffmpegfreeui
      - run: cpack --config build/CPackConfig.cmake -G DEB
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: '*.deb'
  fedora:
    runs-on: ubuntu-24.04
    container: fedora:43
    steps:
      - run: dnf install -y git gcc-c++ cmake ninja-build qt6-qtbase-devel qt6-qtwayland ffmpeg-free rpm-build
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr && cmake --build build -j2 && cpack --config build/CPackConfig.cmake -G RPM
      - uses: actions/upload-artifact@v4
        with:
          name: linux-rpm-fedora
          path: '*.rpm'
